# Local development / self-host convenience wrapper around deploy/Dockerfile.
# Not needed for GitHub Actions (GHCR publishes from the workflow directly).
# Usage: docker compose up -d --build   (then POST to http://localhost:8080)
name: tts-openai

services:
  tts:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        # 1 also installs pocket-tts + CPU torch (~1 GB image) and seeds jarvis1.
        WITH_POCKET: "0"
    image: tts-openai:local
    ports:
      - "8080:8000"
      # Wyoming protocol (Home Assistant). Enable it with
      # POCKET_TTS_WYOMING_ENABLED=1 below. For mDNS auto-discovery use
      # network_mode: host instead of this mapping (bridge mDNS usually does
      # not cross to the LAN), or add the integration manually.
      - "10200:10200"
    environment:
      # All POCKET_TTS_* knobs (docs: README "Configuration (env)"). Lines that
      # are active mirror the image defaults; everything else is commented out -
      # uncomment (and edit the value) to change it.
      # Bind address/port (the app listens on 8000 inside the container).
      - POCKET_TTS_HOST=0.0.0.0
      - POCKET_TTS_PORT=8000
      # Wyoming TTS listener for Home Assistant (unauthenticated by design;
      # keep it on a trusted network). Set to 0 to disable.
      - POCKET_TTS_WYOMING_ENABLED=1
      # - POCKET_TTS_WYOMING_HOST=0.0.0.0
      # - POCKET_TTS_WYOMING_PORT=10200
      # Auto-discovery via _wyoming._tcp.local. (see the ports comment above).
      # - POCKET_TTS_WYOMING_ZEROCONF=1
      # - POCKET_TTS_WYOMING_NAME=tts-openai
      # - POCKET_TTS_WYOMING_SAMPLES_PER_CHUNK=1024
      # - POCKET_TTS_WYOMING_SENTENCE_SILENCE=0.0
      # - POCKET_TTS_WYOMING_AUTO_PUNCTUATION=.?!。？！．؟
      # - POCKET_TTS_WYOMING_READY_TIMEOUT_S=60
      # Piper synthesis options (Home Assistant Piper add-on parity).
      # - POCKET_TTS_PIPER_SPEAKER=0
      # - POCKET_TTS_PIPER_LENGTH_SCALE=1.0
      # - POCKET_TTS_PIPER_NOISE_SCALE=0.667
      # - POCKET_TTS_PIPER_NOISE_W=0.333
      # Default backend: piper (or pocket, only in a WITH_POCKET=1 image).
      - POCKET_TTS_BACKEND=piper
      # OpenAI aliases (alloy, echo, ...) and requests without "voice" use this.
      - POCKET_TTS_DEFAULT_VOICE=it_IT-paola-medium
      # Where Piper .onnx models are cached (baked into /data by the image).
      # - POCKET_TTS_PIPER_VOICE_DIR=/data/cache/piper
      # Download missing Piper voices on demand from rhasspy/piper-voices.
      # - POCKET_TTS_PIPER_AUTO_DOWNLOAD=true
      # LRU of loaded Piper voices. Each entry is a whole ONNX session (~60 MB),
      # so keep this small; pocket-tts uses a larger state cache instead.
      # - POCKET_TTS_MAX_CACHED_VOICES=2
      # Extra alias->voice mapping, comma-separated: alias1=voice1,alias2=voice2
      # (merges over the backend defaults). Every entry must be `alias=voice`.
      # - POCKET_TTS_VOICE_MAP=alloy=en_US-lessac-medium
      # Comma-separated voices to load at startup.
      # - POCKET_TTS_WARMUP_VOICES=
      # --- pocket-tts backend (requires WITH_POCKET=1 above) ------------------
      # - POCKET_TTS_BACKEND=pocket
      # - POCKET_TTS_LANGUAGE=italian_24l
      # - POCKET_TTS_QUANTIZE=1
      # - POCKET_TTS_CACHE_DIR=/data/cache
      # - POCKET_TTS_MAX_UPLOAD_MB=25
      # Evict the model from RAM after this many idle seconds with no API
      # requests; 0 keeps the model resident always. Next request reloads it.
      # - POCKET_TTS_IDLE_UNLOAD_S=300
      # Idle-eviction watchdog poll interval (seconds); only used when unload>0.
      # - POCKET_TTS_IDLE_POLL_S=30
      # Load shedding: reject with an OpenAI 429 when more than this many
      # requests are already inside the critical path (encode+wait+generate).
      # 0 = unlimited (default).
      # - POCKET_TTS_MAX_WAITING=0
      # Max seconds a request may wait for the generation lock before a 429;
      # 0 = wait forever (default). Pair with MAX_WAITING to cap load cleanly.
      # - POCKET_TTS_QUEUE_TIMEOUT_S=0
      # If set, "Authorization: Bearer <key>" is required on every /v1/* request
      # (audio speech, models, voices). Strongly recommended for public deploys.
      # - POCKET_TTS_API_KEY=change-me
    volumes:
      # Persistent Piper voices + pocket weights + cloned-voice registry.
      - tts-data:/data
    restart: unless-stopped
    healthcheck:
      # --healthcheck honors POCKET_TTS_PORT and bypasses HTTP proxy env vars.
      test: ["CMD", "tts-openai", "--healthcheck"]
      interval: 30s
      timeout: 5s
      # The engine loads in a background thread, so this only covers cold
      # Python/uvicorn startup; 60s keeps the first probe inside the grace period.
      start_period: 60s
      retries: 3

volumes:
  tts-data:
